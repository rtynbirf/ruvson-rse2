# П-19/T20 канон роя: еженедельно, группы, лимиты; экосистемы по телу репо
version: 2
updates:
  - package-ecosystem:
    open-pull-requests-limit: 0  # версионный шум выключен (чистка 2026-11-18) "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem:
    open-pull-requests-limit: 0  # версионный шум выключен (чистка 2026-11-18) "pip"
    directory: "/scripts/"
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns: ["*"]
    open-pull-requests-limit: 5
